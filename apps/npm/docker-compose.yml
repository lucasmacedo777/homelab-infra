version: '3.9'
services:
  app:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: always
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - proxy_net
      - passbolt_default
volumes:
  npm_data:
  npm_letsencrypt:
networks:
  proxy_net:
    external: true
  passbolt_default:
    external: true
